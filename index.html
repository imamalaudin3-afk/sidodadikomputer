<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidodadi Komputer Jombang | Toko Komputer Terlengkap</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    /* Custom Scrollbar for better UI */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="text-slate-800 bg-slate-50 min-h-screen flex flex-col selection:bg-red-200 selection:text-red-900">

  <div class="bg-slate-900 text-slate-300 py-2 px-4 text-xs md:text-sm hidden md:block">
    <div class="max-w-7xl mx-auto flex justify-between items-center" id="topbar-content">
      <!-- Injected by JS -->
    </div>
  </div>

  <nav id="main-nav" class="sticky top-0 z-50 bg-white transition-all duration-300 border-b border-slate-100 py-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
      
      <!-- Logo -->
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
        <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-sm">S</div>
        <div class="hidden sm:block">
          <h1 class="font-bold text-xl text-slate-900 leading-none tracking-tight">Sidodadi<span class="text-red-600">.</span></h1>
          <p class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold mt-0.5">Komputer Jombang</p>
        </div>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden lg:flex items-center gap-8 font-medium text-sm text-slate-600" id="desktop-menu">
        <!-- Injected by JS -->
      </div>

      <!-- Right Actions -->
      <div class="flex items-center gap-3 md:gap-4">
        <button onclick="navigate('compare')" class="relative p-2 text-slate-500 hover:text-red-600 transition-colors hidden sm:block" title="Bandingkan Produk">
          <i data-lucide="scale" class="w-5 h-5"></i>
          <span id="compare-badge" class="hidden absolute top-0 right-0 w-4 h-4 bg-red-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white">0</span>
        </button>
        <button onclick="navigate('catalog')" class="p-2 text-slate-500 hover:text-red-600 transition-colors" title="Cari Produk">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>
        
        <a id="nav-wa-btn" href="#" target="_blank" class="hidden sm:flex inline-flex items-center justify-center font-medium rounded-xl transition-all duration-300 ease-out bg-[#25D366] text-white hover:bg-[#20bd5a] shadow-md hover:shadow-lg px-5 py-2.5 gap-2 text-sm">
          <i data-lucide="message-circle" class="w-[18px] h-[18px]"></i> Chat Admin
        </a>

        <!-- Mobile Toggle -->
        <button class="lg:hidden p-2 text-slate-900" onclick="toggleMobileMenu()">
          <i data-lucide="menu" id="mobile-menu-icon" class="w-6 h-6"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu Overlay -->
  <div id="mobile-menu" class="hidden fixed inset-0 top-[72px] bg-white z-40 p-4 flex flex-col h-[calc(100vh-72px)] overflow-y-auto">
     <!-- Injected by JS -->
  </div>

  <main id="app-content" class="flex-grow">
    <!-- Dynamic Content Loaded Here -->
  </main>

  <footer class="bg-slate-950 text-slate-400 pt-16 pb-8 border-t-4 border-red-600 mt-auto" id="app-footer">
    <!-- Injected by JS -->
  </footer>

  <!-- Floating WhatsApp Button -->
  <a id="floating-wa-btn" href="#" target="_blank" class="fixed bottom-6 right-6 z-50 bg-[#25D366] text-white p-4 rounded-full shadow-xl hover:scale-110 hover:bg-[#20bd5a] transition-all duration-300 group flex items-center justify-center" aria-label="Chat WhatsApp">
    <i data-lucide="message-circle" class="w-7 h-7 animate-pulse"></i>
    <span class="absolute right-full mr-4 bg-white text-slate-800 text-sm font-bold px-3 py-1.5 rounded-xl shadow-md opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
      Butuh Bantuan?
    </span>
  </a>

  <script>
    // ==========================================
    // DATA SETTINGS
    // ==========================================
    const STORE_INFO = {
      name: "Sidodadi Komputer Jombang",
      waNumber: "6281234567890",
      address: "Jl. KH. Wahid Hasyim No.XXX, Jombang, Jawa Timur",
      hours: "Senin - Sabtu: 08.00 - 20.00 WIB",
      email: "info@sidodadikomputer.com"
    };

    const CATEGORIES = [
      { id: 'laptop', name: 'Laptop', icon: 'laptop' },
      { id: 'pc', name: 'PC / Desktop', icon: 'monitor' },
      { id: 'monitor', name: 'Monitor', icon: 'monitor' },
      { id: 'printer', name: 'Printer', icon: 'printer' },
      { id: 'accessories', name: 'Accessories', icon: 'keyboard' },
      { id: 'storage', name: 'Storage', icon: 'hard-drive' },
    ];

    const BRANDS = ['ASUS', 'Acer', 'Lenovo', 'HP', 'MSI', 'Axioo', 'Epson', 'Canon'];

    const PRODUCTS = [
      {
        id: 'p1',
        name: 'ASUS ROG Strix G15 (2026)',
        brand: 'ASUS',
        category: 'laptop',
        price: 18499000,
        promoPrice: 17999000,
        cashback: 500000,
        stock: 'Ready Stock',
        rating: 4.9,
        image: 'https://images.unsplash.com/photo-1603302576837-37561b2e2302?auto=format&fit=crop&w=500&q=80',
        specs: { processor: 'Intel Core i7-13700H', ram: '16GB DDR5', storage: '1TB NVMe Gen4 SSD', display: '15.6" FHD 165Hz', gpu: 'NVIDIA RTX 4060 8GB', os: 'Windows 11 Home + OHS', garansi: '2 Tahun Resmi ASUS' }
      },
      {
        id: 'p2',
        name: 'Lenovo IdeaPad Slim 3i',
        brand: 'Lenovo',
        category: 'laptop',
        price: 7499000,
        promoPrice: 6999000,
        cashback: 200000,
        stock: 'Ready Stock',
        rating: 4.7,
        image: 'https://images.unsplash.com/photo-1593642632823-8f785ba67e45?auto=format&fit=crop&w=500&q=80',
        specs: { processor: 'Intel Core i3-1215U', ram: '8GB DDR4', storage: '512GB NVMe SSD', display: '14" FHD IPS', gpu: 'Intel UHD Graphics', os: 'Windows 11 Home + OHS', garansi: '2 Tahun Resmi Lenovo' }
      },
      {
        id: 'p3',
        name: 'Acer Swift Go 14 OLED',
        brand: 'Acer',
        category: 'laptop',
        price: 12999000,
        promoPrice: 12499000,
        cashback: null,
        stock: 'Terbatas',
        rating: 4.8,
        image: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=500&q=80',
        specs: { processor: 'Intel Core i5-13500H', ram: '16GB LPDDR5', storage: '512GB NVMe Gen4 SSD', display: '14" 2.8K OLED 90Hz', gpu: 'Intel Iris Xe Graphics', os: 'Windows 11 Home + OHS', garansi: '3 Tahun Resmi Acer' }
      },
      {
        id: 'p4',
        name: 'HP Victus 15 Gaming',
        brand: 'HP',
        category: 'laptop',
        price: 13500000,
        promoPrice: 12999000,
        cashback: 300000,
        stock: 'Ready Stock',
        rating: 4.6,
        image: 'https://images.unsplash.com/photo-1587614382346-4ec70e388b28?auto=format&fit=crop&w=500&q=80',
        specs: { processor: 'AMD Ryzen 5 7535HS', ram: '16GB DDR5', storage: '512GB NVMe SSD', display: '15.6" FHD 144Hz', gpu: 'NVIDIA RTX 2050 4GB', os: 'Windows 11 Home + OHS', garansi: '2 Tahun Resmi HP' }
      },
      {
        id: 'p5',
        name: 'Epson EcoTank L3210',
        brand: 'Epson',
        category: 'printer',
        price: 2450000,
        promoPrice: 2350000,
        cashback: 50000,
        stock: 'Ready Stock',
        rating: 4.9,
        image: 'https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?auto=format&fit=crop&w=500&q=80',
        specs: { processor: '-', ram: '-', storage: '-', display: '-', gpu: '-', os: 'Windows & Mac', garansi: '2 Tahun / 30.000 Cetak' }
      },
      {
        id: 'p6',
        name: 'LG 24MP400 24" IPS Monitor',
        brand: 'LG',
        category: 'monitor',
        price: 1550000,
        promoPrice: 1450000,
        cashback: null,
        stock: 'Ready Stock',
        rating: 4.7,
        image: 'https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=500&q=80',
        specs: { processor: '-', ram: '-', storage: '-', display: '23.8" FHD IPS 75Hz', gpu: '-', os: '-', garansi: '1 Tahun Resmi LG' }
      }
    ];

    const NAV_LINKS = [
      { name: 'Home', view: 'home' },
      { name: 'Produk', view: 'catalog' },
      { name: 'Promo', view: 'promo' },
      { name: 'Service', view: 'service' },
      { name: 'Artikel', view: 'artikel' },
      { name: 'Lokasi', view: 'location' },
    ];

    // ==========================================
    // STATE & UTILS
    // ==========================================
    let state = {
      view: 'home',
      viewData: null,
      isMobileMenuOpen: false,
      compareList: [],
      catalogSearch: '',
      catalogCategory: 'All',
      catalogSort: 'terbaru',
      heroSlideIndex: 0
    };

    let heroSlideTimer = null;

    const formatRupiah = (number) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
    };

    const generateWAMessage = (type, dataId) => {
      let message = `Halo Admin Sidodadi Komputer, saya ingin bertanya.`;
      if (type === 'product' && dataId) {
        const p = PRODUCTS.find(x => x.id === dataId);
        if(p) message = `Halo Sidodadi Komputer, saya tertarik dengan produk *${p.name}* yang ada di website. Apakah stoknya masih tersedia?`;
      } else if (type === 'service') {
        message = `Halo Sidodadi Komputer, saya ingin konsultasi mengenai service perangkat saya.`;
      }
      return `https://wa.me/${STORE_INFO.waNumber}?text=${encodeURIComponent(message)}`;
    };

    const updateDocumentTitle = () => {
      const titles = {
        home: `${STORE_INFO.name} | Toko Komputer Terlengkap`,
        catalog: `Katalog Produk | ${STORE_INFO.name}`,
        detail: state.viewData ? `${state.viewData.name} | ${STORE_INFO.name}` : STORE_INFO.name,
        service: `Pusat Service Komputer | ${STORE_INFO.name}`,
        location: `Lokasi Toko | ${STORE_INFO.name}`,
        compare: `Bandingkan Produk | ${STORE_INFO.name}`,
      };
      document.title = titles[state.view] || STORE_INFO.name;
    };

    const navigate = (newView, dataId = null) => {
      state.view = newView;
      if (dataId) {
        state.viewData = PRODUCTS.find(p => p.id === dataId);
      } else {
        state.viewData = null;
      }
      state.isMobileMenuOpen = false;
      
      // Stop hero timer if navigating away
      if(heroSlideTimer) { clearInterval(heroSlideTimer); heroSlideTimer = null; }
      
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    const toggleMobileMenu = () => {
      state.isMobileMenuOpen = !state.isMobileMenuOpen;
      renderNavigation();
    };

    const handleAddCompare = (id) => {
      event.stopPropagation(); // prevent triggering parent clicks
      const product = PRODUCTS.find(p => p.id === id);
      if (state.compareList.find(p => p.id === product.id)) return;
      if (state.compareList.length >= 3) {
        alert("Maksimal membandingkan 3 produk. Hapus salah satu terlebih dahulu di halaman Bandingkan.");
        return;
      }
      state.compareList.push(product);
      updateCompareBadge();
      navigate('compare');
    };

    const handleRemoveCompare = (id) => {
      state.compareList = state.compareList.filter(p => p.id !== id);
      updateCompareBadge();
      navigate('compare');
    };

    const updateCompareBadge = () => {
      const badge = document.getElementById('compare-badge');
      if (state.compareList.length > 0) {
        badge.textContent = state.compareList.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    };

    const Button = (text, variant = 'primary', size = 'md', className = '', onclick = '', href = '') => {
      const baseStyle = "inline-flex items-center justify-center font-medium rounded-xl transition-all duration-300 ease-out cursor-pointer";
      const variants = {
        primary: "bg-red-600 text-white hover:bg-red-700 shadow-md hover:shadow-lg",
        secondary: "bg-slate-900 text-white hover:bg-slate-800",
        outline: "border-2 border-slate-200 text-slate-700 hover:border-red-600 hover:text-red-600",
        ghost: "text-slate-600 hover:bg-slate-100",
        whatsapp: "bg-[#25D366] text-white hover:bg-[#20bd5a] shadow-md hover:shadow-lg"
      };
      const sizeStyle = size === 'sm' ? 'px-3 py-1.5 text-sm' : 'px-5 py-2.5';
      const classes = `${baseStyle} ${variants[variant]} ${sizeStyle} ${className}`;

      if (href) {
        return `<a href="${href}" class="${classes}" target="_blank" rel="noreferrer" onclick="${onclick}">${text}</a>`;
      }
      return `<button class="${classes}" onclick="${onclick}">${text}</button>`;
    };

    const renderProductCard = (product) => {
      return `
        <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-[0_2px_10px_rgba(0,0,0,0.04)] hover:shadow-[0_10px_20px_rgba(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300 group flex flex-col h-full fade-in">
          <div class="relative aspect-square mb-4 bg-slate-50 rounded-xl overflow-hidden flex items-center justify-center cursor-pointer" onclick="navigate('detail', '${product.id}')">
            <img src="${product.image}" alt="${product.name}" class="object-contain w-full h-full p-4 group-hover:scale-105 transition-transform duration-500" />
            ${product.cashback ? `
              <div class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-md flex items-center gap-1">
                <i data-lucide="zap" class="w-3 h-3"></i> Cashback
              </div>
            ` : ''}
            <div class="absolute top-2 right-2 bg-white/90 backdrop-blur text-slate-700 text-xs font-semibold px-2 py-1 rounded-md border border-slate-200">
              ${product.stock}
            </div>
          </div>
          
          <div class="flex-grow flex flex-col">
            <div class="text-xs text-slate-500 mb-1 flex justify-between items-center">
              <span>${product.brand}</span>
              <span class="flex items-center text-yellow-500 gap-1"><i data-lucide="star" class="w-3 h-3 fill-current"></i> ${product.rating}</span>
            </div>
            <h3 class="font-bold text-slate-900 leading-tight mb-2 line-clamp-2 cursor-pointer hover:text-red-600 transition-colors" onclick="navigate('detail', '${product.id}')">
              ${product.name}
            </h3>
            
            <div class="text-xs text-slate-500 mb-3 space-y-1 line-clamp-2">
              ${product.specs.processor ? `<p>• ${product.specs.processor}</p>` : ''}
              ${product.specs.ram ? `<p>• ${product.specs.ram} | ${product.specs.storage}</p>` : ''}
            </div>

            <div class="mt-auto">
              ${product.promoPrice ? `
                <div>
                  <p class="text-xs text-slate-400 line-through">${formatRupiah(product.price)}</p>
                  <p class="text-lg font-bold text-red-600">${formatRupiah(product.promoPrice)}</p>
                </div>
              ` : `
                <p class="text-lg font-bold text-slate-900">${formatRupiah(product.price)}</p>
              `}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-100">
            ${Button('Detail', 'outline', 'sm', '', `navigate('detail', '${product.id}')`)}
            ${Button('Beli WA', 'whatsapp', 'sm', '', '', generateWAMessage('product', product.id))}
          </div>
          <button onclick="handleAddCompare('${product.id}')" class="mt-2 text-xs text-center text-slate-500 hover:text-slate-900 w-full py-1 flex items-center justify-center gap-1 cursor-pointer">
            <i data-lucide="scale" class="w-3.5 h-3.5"></i> Bandingkan
          </button>
        </div>
      `;
    };

    const renderHomeView = () => {
      const heroBanners = [
        { title: "Laptop Terbaru, Harga Terbaik", sub: "Laptop, PC, Printer, dan Accessories untuk segala kebutuhan.", color: "bg-slate-900" },
        { title: "Promo Khusus Mahasiswa", sub: "Diskon up to 1 Juta + Free Mouse Wireless.", color: "bg-blue-900" },
        { title: "PC Rakitan Gaming & Creator", sub: "Konsultasi gratis, rakit sesuai budgetmu.", color: "bg-red-900" }
      ];

      // Setup hero timer if not exist
      if(!heroSlideTimer) {
        heroSlideTimer = setInterval(() => {
          state.heroSlideIndex = (state.heroSlideIndex + 1) % heroBanners.length;
          document.getElementById('hero-title').innerText = heroBanners[state.heroSlideIndex].title;
          document.getElementById('hero-sub').innerText = heroBanners[state.heroSlideIndex].sub;
          
          // update indicators
          document.querySelectorAll('.hero-indicator').forEach((el, idx) => {
            if(idx === state.heroSlideIndex) {
              el.className = "hero-indicator w-8 h-3 rounded-full transition-all bg-red-600 cursor-pointer";
            } else {
              el.className = "hero-indicator w-3 h-3 rounded-full transition-all bg-white/50 hover:bg-white cursor-pointer";
            }
          });
        }, 5000);
      }

      let html = `
        <div class="animate-in fade-in duration-500">
          <!-- Hero -->
          <section class="relative bg-slate-900 text-white overflow-hidden">
            <div class="absolute inset-0 z-0 opacity-40">
              <img src="https://images.unsplash.com/photo-1531297172864-fd222104cbd0?auto=format&fit=crop&w=1600&q=80" alt="Tech" class="w-full h-full object-cover" />
            </div>
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 py-24 md:py-32 flex flex-col md:flex-row items-center">
              <div class="md:w-2/3">
                <span class="inline-block py-1 px-3 rounded-full bg-red-600 text-xs font-bold tracking-wider mb-4 animate-bounce">PROMO BULAN INI</span>
                <h1 id="hero-title" class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4 leading-tight transition-all duration-300">
                  ${heroBanners[state.heroSlideIndex].title}
                </h1>
                <p id="hero-sub" class="text-lg md:text-xl text-slate-300 mb-8 max-w-2xl">
                  ${heroBanners[state.heroSlideIndex].sub}
                </p>
                <div class="flex flex-wrap gap-4">
                  ${Button(`Lihat Produk <i data-lucide="arrow-right" class="w-[18px] h-[18px] ml-2"></i>`, 'primary', 'md', 'flex items-center', `navigate('catalog')`)}
                  ${Button('Chat WhatsApp', 'whatsapp', 'md', '', '', generateWAMessage('general'))}
                </div>
              </div>
            </div>
            <div class="absolute bottom-4 left-0 right-0 flex justify-center gap-2 z-10" id="hero-indicators">
              ${heroBanners.map((_, idx) => `
                <button onclick="setHeroSlide(${idx})" class="hero-indicator ${state.heroSlideIndex === idx ? 'bg-red-600 w-8' : 'bg-white/50 hover:bg-white w-3'} h-3 rounded-full transition-all cursor-pointer"></button>
              `).join('')}
            </div>
          </section>

          <!-- Categories -->
          <section class="py-12 bg-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="grid grid-cols-3 md:grid-cols-6 gap-4">
                ${CATEGORIES.map(cat => `
                  <div onclick="navigate('catalog'); updateCatalogFilter('cat', '${cat.id}')" class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-2xl hover:bg-red-50 hover:text-red-600 cursor-pointer transition-colors group">
                    <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm mb-3 group-hover:scale-110 transition-transform">
                      <i data-lucide="${cat.icon}" class="w-6 h-6 text-slate-700 group-hover:text-red-600"></i>
                    </div>
                    <span class="text-sm font-semibold text-center">${cat.name}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>

          <!-- Promo Section -->
          <section class="py-16 bg-slate-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex justify-between items-end mb-8">
                <div>
                  <h2 class="text-3xl font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="tag" class="w-8 h-8 text-red-600"></i> Promo Spesial
                  </h2>
                  <p class="text-slate-500 mt-2">Penawaran terbaik minggu ini, jangan sampai kehabisan!</p>
                </div>
                <div class="hidden md:flex">${Button('Lihat Semua', 'ghost', 'md', '', `navigate('promo')`)}</div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                ${PRODUCTS.slice(0, 4).map(p => renderProductCard(p)).join('')}
              </div>
              <div class="mt-6 md:hidden">
                ${Button('Lihat Semua Promo', 'outline', 'md', 'w-full', `navigate('promo')`)}
              </div>
            </div>
          </section>

          <!-- Needs -->
          <section class="py-16 bg-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <h2 class="text-3xl font-bold text-center text-slate-900 mb-10">Cari Sesuai Kebutuhanmu</h2>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                ${['Pelajar', 'Kantoran', 'Gaming', 'Desain Grafis'].map(need => `
                  <div onclick="navigate('catalog')" class="relative h-40 rounded-2xl overflow-hidden cursor-pointer group bg-slate-900">
                    <img src="https://source.unsplash.com/random/400x300/?${need.toLowerCase()},computer" alt="${need}" class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:scale-110 transition-transform duration-700 grayscale-[30%] group-hover:grayscale-0" />

    `;

    const renderPlaceholder = (title) => `
      <div class="flex flex-col items-center justify-center py-32 text-center px-4 animate-in fade-in">
        <i data-lucide="wrench" class="w-16 h-16 text-slate-300 mb-6"></i>
        <h2 class="text-2xl font-bold text-slate-900 mb-2">Halaman Sedang Dikembangkan</h2>
        <p class="text-slate-500 mb-6">Halaman ${title} akan segera hadir.</p>
        ${Button('Kembali ke Home', 'primary', 'md', '', `navigate('home')`)}
      </div>
    `;


    const renderNavigation = () => {
      // Desktop Nav Links
      const desktopMenu = document.getElementById('desktop-menu');
      desktopMenu.innerHTML = NAV_LINKS.map(link => `
        <button 
          onclick="navigate('${link.view}')"
          class="hover:text-red-600 transition-colors ${state.view === link.view ? 'text-red-600 font-bold border-b-2 border-red-600 pb-1 -mb-1' : ''}"
        >
          ${link.name}
        </button>
      `).join('');

      // Mobile Menu
      const mobileMenu = document.getElementById('mobile-menu');
      if (state.isMobileMenuOpen) {
        mobileMenu.classList.remove('hidden');
        document.getElementById('mobile-menu-icon').setAttribute('data-lucide', 'x');
        // Render mobile links
        mobileMenu.innerHTML = `
          <div class="flex flex-col gap-4 text-lg font-semibold text-slate-700">
            ${NAV_LINKS.map(link => `
              <button 
                onclick="navigate('${link.view}')"
                class="text-left py-3 px-4 rounded-xl ${state.view === link.view ? 'bg-red-50 text-red-600' : 'hover:bg-slate-50'}"
              >
                ${link.name}
              </button>
            `).join('')}
            <button onclick="navigate('compare')" class="text-left py-3 px-4 rounded-xl flex items-center justify-between hover:bg-slate-50">
              Bandingkan Produk 
              <span class="bg-red-100 text-red-600 py-0.5 px-2 rounded-full text-sm">${state.compareList.length}</span>
            </button>
          </div>
          <div class="mt-auto pb-8">
            ${Button('Hubungi via WhatsApp', 'whatsapp', 'md', 'w-full justify-center py-4 text-lg', '', generateWAMessage('general'))}
          </div>
        `;
      } else {
        mobileMenu.classList.add('hidden');
        document.getElementById('mobile-menu-icon').setAttribute('data-lucide', 'menu');
      }

      lucide.createIcons();
    };

    const renderStaticElements = () => {
      // Topbar
      document.getElementById('topbar-content').innerHTML = `
        <div class="flex gap-4">
          <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ${STORE_INFO.address}</span>
          <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${STORE_INFO.hours}</span>
        </div>
        <div class="flex gap-4 items-center">
          <span class="text-red-400 font-bold animate-pulse">🔥 Promo Cashback s/d 1 Juta!</span>
          <a href="https://wa.me/${STORE_INFO.waNumber}" target="_blank" rel="noreferrer" class="hover:text-white transition-colors flex items-center gap-1">
            <i data-lucide="phone" class="w-3.5 h-3.5"></i> +${STORE_INFO.waNumber}
          </a>
        </div>
      `;

      // Footer
      document.getElementById('app-footer').innerHTML = `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="grid grid-cols-1 md:grid-cols-4 gap-10 mb-12">
            
            <div class="md:col-span-1">
              <div class="flex items-center gap-2 mb-6">
                <div class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center text-white font-black text-lg">S</div>
                <h2 class="font-bold text-xl text-white tracking-tight">Sidodadi.</h2>
              </div>
              <p class="text-sm leading-relaxed mb-6">
                Toko komputer dan laptop terlengkap di Jombang. Melayani penjualan, rakit PC, service, dan upgrade dengan harga terbaik dan bergaransi.
              </p>
              <div class="flex gap-4">
                <a href="#" class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center hover:bg-red-600 hover:text-white transition-colors"><i data-lucide="instagram" class="w-[18px] h-[18px]"></i></a>
                <a href="#" class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center hover:bg-red-600 hover:text-white transition-colors"><i data-lucide="facebook" class="w-[18px] h-[18px]"></i></a>
                <a href="#" class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center hover:bg-red-600 hover:text-white transition-colors"><i data-lucide="youtube" class="w-[18px] h-[18px]"></i></a>
              </div>
            </div>

            <div>
              <h3 class="text-white font-bold mb-6 tracking-wide">Menu Cepat</h3>
              <ul class="space-y-3 text-sm">
                <li><button onclick="navigate('catalog')" class="hover:text-red-400 transition-colors">Katalog Produk</button></li>
                <li><button onclick="navigate('promo')" class="hover:text-red-400 transition-colors">Promo & Diskon</button></li>
                <li><button onclick="navigate('service')" class="hover:text-red-400 transition-colors">Service & Repair</button></li>
                <li><button onclick="navigate('artikel')" class="hover:text-red-400 transition-colors">Blog & Tips</button></li>
              </ul>
            </div>

            <div>
              <h3 class="text-white font-bold mb-6 tracking-wide">Layanan Kami</h3>
              <ul class="space-y-3 text-sm">
                <li><span class="hover:text-red-400 transition-colors cursor-pointer">Jual Beli Laptop</span></li>
                <li><span class="hover:text-red-400 transition-colors cursor-pointer">Rakit PC Gaming</span></li>
                <li><span class="hover:text-red-400 transition-colors cursor-pointer">Install Ulang Windows</span></li>
                <li><span class="hover:text-red-400 transition-colors cursor-pointer">Konsultasi IT Kantor</span></li>
              </ul>
            </div>

            <div>
              <h3 class="text-white font-bold mb-6 tracking-wide">Hubungi Kami</h3>
              <ul class="space-y-4 text-sm">
                <li class="flex items-start gap-3">
                  <i data-lucide="map-pin" class="w-[18px] h-[18px] text-red-600 shrink-0 mt-0.5"></i>
                  <span>${STORE_INFO.address}</span>
                </li>
                <li class="flex items-center gap-3">
                  <i data-lucide="phone" class="w-[18px] h-[18px] text-red-600 shrink-0"></i>
                  <span>+${STORE_INFO.waNumber}</span>
                </li>
                <li class="flex items-center gap-3">
                  <i data-lucide="mail" class="w-[18px] h-[18px] text-red-600 shrink-0"></i>
                  <span>${STORE_INFO.email}</span>
                </li>
              </ul>
            </div>

          </div>
          
          <div class="border-t border-slate-900 pt-8 flex flex-col md:flex-row justify-between items-center gap-4 text-xs">
            <p>&copy; ${new Date().getFullYear()} ${STORE_INFO.name}. All Rights Reserved.</p>
            <div class="flex gap-4">
              <span class="hover:text-white cursor-pointer">Privacy Policy</span>
              <span class="hover:text-white cursor-pointer">Terms of Service</span>
            </div>
          </div>
        </div>
      `;

      // Static WhatsApp links
      document.getElementById('nav-wa-btn').href = generateWAMessage('general');
      document.getElementById('floating-wa-btn').href = generateWAMessage('general');
    };

    const renderApp = () => {
      updateDocumentTitle();
      renderNavigation();
      updateCompareBadge();

      const appContent = document.getElementById('app-content');
      
      switch (state.view) {
        case 'home':
          appContent.innerHTML = renderHomeView();
          break;
        case 'catalog':
          appContent.innerHTML = renderCatalogView();
          break;
        case 'detail':
          appContent.innerHTML = renderDetailView();
          break;
        case 'compare':
          appContent.innerHTML = renderCompareView();
          break;
        case 'service':
          appContent.innerHTML = renderServiceView();
          break;
        case 'location':
          appContent.innerHTML = renderLocationView();
          break;
        case 'promo':
        case 'artikel':
        case 'tentang':
          appContent.innerHTML = renderPlaceholder(state.view.charAt(0).toUpperCase() + state.view.slice(1));
          break;
        default:
          appContent.innerHTML = renderHomeView();
      }

      // Re-initialize Lucide Icons for newly injected DOM
      lucide.createIcons();
    };

    window.addEventListener('scroll', () => {
      const nav = document.getElementById('main-nav');
      if (window.scrollY > 20) {
        nav.classList.add('shadow-md', 'py-3');
        nav.classList.remove('py-4');
      } else {
        nav.classList.remove('shadow-md', 'py-3');
        nav.classList.add('py-4');
      }
    });

    // Initial Load
    window.addEventListener('DOMContentLoaded', () => {
      renderStaticElements();
      renderApp();
    });

  </script>
</body>
</html>
